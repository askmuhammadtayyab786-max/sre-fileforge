global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: app-node
    static_configs:
      - targets: ['192.168.4.111:9100']

  - job_name: app-cadvisor
    static_configs:
      - targets: ['192.168.4.111:8080']

  - job_name: probe-fileforge
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://filefordge.duckdns.org:9444/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
